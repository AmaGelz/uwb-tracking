<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password | SUPALAI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="signin-page">
  <main class="signin">
    <div class="brand" style="display:flex; justify-content:center; margin-bottom:26px;">
      <img src="logo.jpg" alt="Supalai Logo" style="max-height:40px;width:auto">
    </div>

    <form id="forgot-form">
      <h2>ลืมรหัสผ่าน</h2>
      <p class="signin-description">กรอกอีเมลที่ใช้เข้าสู่ระบบ แล้วเราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้คุณ</p>
      <div class="form-message" aria-live="polite"></div>
      <div class="field">
        <label class="label" for="reset-email">Email</label>
        <input class="control" id="reset-email" type="email" autocomplete="email" placeholder="name@supalai.com" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">ส่งลิงก์ตั้งรหัสผ่าน</button>
      <a class="signin-forgot" href="login.html">กลับไปหน้าเข้าสู่ระบบ</a>
    </form>

    <form id="reset-form" hidden>
      <h2>ตั้งรหัสผ่าน</h2>
      <p class="signin-description">สำหรับเปิดใช้งานบัญชีใหม่หรือเปลี่ยนรหัสผ่าน รหัสต้องมีอย่างน้อย 8 ตัวอักษร</p>
      <div class="form-message" aria-live="polite"></div>
      <div class="field">
        <label class="label" for="new-password">รหัสผ่านใหม่</label>
        <input class="control" id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      </div>
      <div class="field">
        <label class="label" for="confirm-password">ยืนยันรหัสผ่านใหม่</label>
        <input class="control" id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">บันทึกรหัสผ่านใหม่</button>
      <a class="signin-forgot" href="login.html">กลับไปหน้าเข้าสู่ระบบ</a>
    </form>
  </main>
  <script src="js/runtime-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/password-reset.js"></script>
</body>
</html>
