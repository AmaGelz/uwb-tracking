<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | SUPALAI</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="signin-page">
  <form class="signin" id="signin-form">
    <div class="brand" style="display:flex; justify-content:center; margin-bottom:26px;">
      <img src="logo.jpg" alt="Supalai Logo" style="max-height:40px;width:auto">
    </div>
    <h2>Sign In</h2>
    <div id="signin-err"></div>
    <div class="field">
      <label class="label" for="si-email">Email</label>
      <input class="control" id="si-email" type="email" autocomplete="username" placeholder="name@supalai.com" required>
    </div>
    <div class="field">
      <label class="label" for="si-pw">Password</label>
      <input class="control" id="si-pw" type="password" autocomplete="current-password" required>
      <div class="signin-password-actions">
        <a class="signin-forgot" href="reset-password.html">ลืมรหัสผ่าน?</a>
      </div>
    </div>
    <button class="btn btn-primary btn-block" type="submit">เข้าสู่ระบบ</button>
    <div class="signin-divider"><span>หรือ</span></div>
    <div class="google-wrap" id="google-btn" aria-live="polite" aria-busy="true">
      <div class="google-disabled">กำลังโหลด Google Sign-In…</div>
    </div>
    <div class="signin-hint">เข้าสู่ระบบด้วย Email และ Password หรือบัญชี Google ที่ผูกกับระบบ</div>
  </form>
  <script src="js/runtime-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
