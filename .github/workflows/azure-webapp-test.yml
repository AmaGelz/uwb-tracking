name: Build and deploy test web app

on:
  push:
    branches:
      - feature/plan-editor-cad
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uwbtrackingtest-production
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: uwbtrackingtest
  PYTHON_VERSION: "3.12"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies and validate build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q backend/backend
          python -m unittest discover -s tests -p 'test_legacy_tag_bridge.py' -v

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
